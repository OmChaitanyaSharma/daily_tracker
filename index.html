    <!-- Structured Data (Schema.org JSON-LD: Organization, SoftwareApplication, FAQPage) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://daily-tracker-iota-one.vercel.app/#organization",
          "name": "Daily Tracker OS",
          "url": "https://daily-tracker-iota-one.vercel.app/",
          "logo": "https://daily-tracker-iota-one.vercel.app/hero.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "url": "https://daily-tracker-iota-one.vercel.app/"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://daily-tracker-iota-one.vercel.app/#application",
          "name": "Daily Tracker",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "All modern web browsers",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "description": "Offline-first personal growth OS with habit matrix tracking, workout logging, deep work graphs, and gamified RPG progression on your device."
        },
        {
          "@type": "FAQPage",
          "@id": "https://daily-tracker-iota-one.vercel.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does offline-first storage work in Daily Tracker?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Daily Tracker uses Dexie.js and client-side IndexedDB to store all entries, habit logs, study hours, and workout sets locally on your device. Your data remains fully accessible and performant even without an internet connection."
              }
            },
            {
              "@type": "Question",
              "name": "How are daily streaks and streak freezes calculated?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Streaks require achieving your target daily habit completion percentage (default 75%), minimum focus hours, and exercise goals. Maintaining 7 consecutive days of completion earns a Freeze Token that protects your streak if a day is missed."
              }
            },
            {
              "@type": "Question",
              "name": "Can I export or backup my tracking data?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, you can export your complete tracking history as a portable JSON backup file at any time from the Logs or Settings pages, and restore it on any device."
              }
            },
            {
              "@type": "Question",
              "name": "How does the RPG leveling system work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Logged deep work hours and workout volume are converted into experience points (XP) that advance your discrete Developer and Fitness levels with custom polynomial curves and unlockable rank titles."
              }
            }
          ]
        }
      ]
    }
    </script>
